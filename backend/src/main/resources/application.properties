# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=social-shelf-backend

# In-Memory H2 Database (Ready out-of-the-box, no external DB install required)
spring.datasource.url=jdbc:h2:mem:socialshelfdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.com.socialshelf=INFO
logging.level.org.springframework.web=INFO
